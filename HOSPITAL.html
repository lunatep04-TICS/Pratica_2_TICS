<HTML>
    <HEAD> 
      <H1 ALIGN="CENTER"> <FONT COLOR="#02AC66"> HOSPITAL </FONT> </H1>
    </HEAD>
        <BODY FONT FACE="WhatTheFont">
         <IMG SRC="IMMS.JPG" ALIGN="RIGHT" HEIGHE="10%" WIDTH="15%">
            <H1 ALIGN="CENTER"> <FONT COLOR="#02AC66">  Instituto Mexicano del Seguro Social (IMSS)</FONT> </H1>
	<TABLE BORDER="1" WIDTH="100%">
    <TR>
    <I><H2 ALIGN="CENTER"> <FONT COLOR="#02AC66"> DATOS DEL PACIENTE </FONT></I> </H2>
        <FORM>
            <TEXTBOX>
              <TH valign="top">
                <p align="left">
                  <TABLE WIDTH="100%">
        <label>Nombre</label>
        <input type="text"<BR>
        <label>Apellido paterno</label>
        <input type="text"><BR>
        <label>Apellido materno</label>
        <input type="text"><BR>
        <label>Edad</label>
        <input type="number placeholder="Números sin espacios">
        <TD><B> CURP: </B> <INPUT type="text" NAME="CURP"></TD>
         <TD><B> Localidad: </B> <INPUT type="text" NAME="Localidad"></TD>
     <label>Sexo</label>
     <input type="radio" value="M"> <span>Masculino </span>
     <input type="radio" value="F"> <span>Femenino </span>
     <label>NSS</label>
     <input type="tel">
    </TR>
     </TABLE>
    <TR>
    <TD>
   <LISTBOX>
                    <B> Alergias: </B> <SELECT NAME="Alergias">
                        <OPTION> Penicilina </OPTION>
                        <OPTION> Sulfas</OPTION>
                        <OPTION> AINE </OPTION>
                        <OPTION> Látex</OPTION>
                        <OPTION> Alimentos </OPTION>
                        <OPTION> Sin alergias </OPTION>

                    </SELECT> <Br> <Br>
                </LISTBOX>
    </TR>
    </TD>

    <TR>
    <TD>
   <LISTBOX>
                    <B> Enfermedades Cronicas: </B> <SELECT NAME="Enfermedades Cronicas">
                        <OPTION> Diabetes mellitus </OPTION>
                        <OPTION> Hipertensión</OPTION>
                        <OPTION> Asma / EPOC </OPTION>
                        <OPTION> Cardiopatía </OPTION>
                        <OPTION> Cáncer </OPTION>
                        <OPTION> IRC </OPTION>
                        <OPTION> VIH </OPTION>
                        <OPTION> Ninguna </OPTION>

                    </SELECT> <Br> <Br>
                </LISTBOX>
   </TR>
   </TD>

   <TR>
   <TD>
                      <B> <label> Motivo de consulta:</label></B>
                      <textarea rows="3" placeholder="El motivo..."></textarea>
    </TR>
  </TD>
 
    <TR>
  <TD>
  <LISTBOX>
                    <B> Religión: </B> <SELECT NAME="Religion">
                        <OPTION> Católica </OPTION>
                        <OPTION> Cristiana / Evangélica </OPTION>
                        <OPTION> Testigo de Jehová </OPTION>
                        <OPTION> Judaica </OPTION>
                        <OPTION> Islámica </OPTION>
                        <OPTION> IRC </OPTION>
                        <OPTION> Sin religión </OPTION>
                        <OPTION> Otra </OPTION>

                    </SELECT> <Br> <Br>
                </LISTBOX>

  </TR>
   </TD>

   <TR>
 <TD>
 <LISTBOX>
                    <B> Tipo de sangre: </B> <SELECT NAME="Tipo de sangre">
                        <OPTION> A+ </OPTION>
                        <OPTION> A- </OPTION>
                        <OPTION> B+ </OPTION>
                        <OPTION> B- </OPTION>
                        <OPTION> O+ </OPTION>
                        <OPTION> O- </OPTION>
                        <OPTION> AB+ </OPTION>
                        <OPTION> AB- </OPTION>

                    </SELECT> <Br> <Br>
                </LISTBOX>

  </TR>
  </TD>

  <TR>
  <TD>
             <B> <label>Nacionalidad:</label><input type="text" placeholder="Mexicana"></B>
  </TR>
  </TD>

    <TR>
  <TD>
          <B><label>Fecha de Ingreso</label></B>
          <input type="date" placeholder="DD/MM/AAAA">   
  </TR>
  </TD>
  
   <TR>
  <TD>
              <h3>Signos vitales</h3>

                <B><label>Peso</label>
          <input type="number" placeholder="0.0" step="0.1" min="0">
          <span class="vital-unit">kilogramos (kg)</span><B><BR>

             <BR><B><label>Talla</label>
          <input type="number" placeholder="0.00" step="0.01" min="0">
          <span class="vital-unit">metros (m)</span><B><BR>
            
           <BR><B><label>Temperatura</label>
          <input type="number" placeholder="36.5" step="0.1" min="30" max="45">
          <span class="vital-unit">°Celsius</span><B><BR>

           <BR><B> <label>Presión arterial</label>
          <input type="text" placeholder="120/80">
          <span class="vital-unit">mmHg (sis/dia)</span><B><BR>

           <BR><B><label>Saturación O₂</label>
          <input type="number" placeholder="98" min="0" max="100">
          <span class="vital-unit">% SpO₂</span><B><BR>

           <BR> <B><label> Observaciones adicionales:</label></B>
           <textarea rows="3" placeholder="El Paciente..."></textarea><B><BR>

     </TR>
  </TD>


       </FORM>
    </BODY>
</HTML>
